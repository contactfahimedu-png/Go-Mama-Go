<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fahim Survival Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
height:100vh;
overflow:hidden;
font-family:Segoe UI;
cursor:none;
position:relative;
background: linear-gradient(to bottom, #87ceeb 0%, #f0f8ff 100%);
}

/* Moving airplane emoji */
.airplane{
position:absolute;
top:0;
font-size:6vw;
opacity:0.8;
animation:airplaneMove linear infinite;
}

@keyframes airplaneMove{
0%{transform:translateX(-100px);}
100%{transform:translateX(110vw);}
}

header{
display:flex;
justify-content:space-between;
padding:1vh 3vw;
background:rgba(255,255,255,.3);
backdrop-filter:blur(5px);
border-radius:10px;
font-size:4vw;
}

#player{
position:absolute;
border-radius:50%;
box-shadow:0 0 20px cyan;
width:12vw;
touch-action:none;
}

.enemy, .health, .minus{
position:absolute;
border-radius:50%;
animation-name:fall;
animation-timing-function:linear;
}
.enemy{width:10vw;}
.health, .minus{width:8vw;}

@keyframes fall{
0%{transform:translateY(-120px);}
100%{transform:translateY(110vh);}
}

.center{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

button{
padding:2vh 5vw;
border:none;
border-radius:30px;
background:#ff004c;
color:white;
font-size:5vw;
cursor:pointer;
}

#overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
border-radius:10px;
text-align:center;
}

#overlay h1, #overlay h2{
color:white;
font-weight:bold;
text-shadow: 2px 2px 4px black;
margin:1vh 0;
font-size:6vw;
}

/* Navigation buttons */
.navButtons{
position:fixed;
bottom:2vh;
left:50%;
transform:translateX(-50%);
display:flex;
gap:2vw;
z-index:999;
}

.navButtons button{
padding:2vh 3vw;
border-radius:15px;
background:#00bfff;
font-size:4vw;
color:white;
}

</style>
</head>
<body>

<!-- Airplane emojis floating -->
<div class="airplane" style="top:5vh;animation-duration:60s;">🛩️</div>
<div class="airplane" style="top:15vh;animation-duration:80s;">🛩️</div>
<div class="airplane" style="top:25vh;animation-duration:100s;">🛩️</div>

<header>
<div>Score: <span id="score">0</span></div>
<div>❤️ Lives: <span id="lives">3</span></div>
<div>High Score: <span id="highScore">0</span></div>
</header>

<div class="center" id="startScreen">
<h1>🌤 Fahim Sky Survival</h1>
<button onclick="startGame()">Start Game</button>
</div>

<img src="fahim.png" id="player">

<!-- Navigation buttons -->
<div class="navButtons">
<button onclick="movePlayer('left')">⬅️</button>
<button onclick="movePlayer('up')">⬆️</button>
<button onclick="movePlayer('down')">⬇️</button>
<button onclick="movePlayer('right')">➡️</button>
</div>

<div id="overlay">
<h1>💀 Game Over</h1>
<h2>Score: <span id="finalScore"></span></h2>
<button onclick="location.reload()">Restart</button>
</div>

<audio id="explodeSound" src="explode.mp3"></audio>
<audio id="healthSound" src="health.mp3"></audio>
<audio id="minusSound" src="minus.mp3"></audio>
<audio id="bgMusic" src="bgmusic.mp3" loop></audio>

<script>
let score=0;
let lives=3;
let maxLives=5;
let gameActive=false;
let highScore=localStorage.getItem("highScore")||0;
document.getElementById("highScore").innerText=highScore;

const player=document.getElementById("player");
const explodeSound=document.getElementById("explodeSound");
const healthSound=document.getElementById("healthSound");
const minusSound=document.getElementById("minusSound");
const bgMusic=document.getElementById("bgMusic");

bgMusic.volume=0.3;
const baseFallDuration=6;

// Set player starting position: center bottom-ish
function setPlayerStart(){
    player.style.left = (window.innerWidth/2 - player.offsetWidth/2) + "px";
    player.style.top = (window.innerHeight*0.75) + "px";
}

// Mobile touch drag
let dragging=false;
player.addEventListener('touchstart',(e)=>{
    dragging=true; e.preventDefault();
});
player.addEventListener('touchend',(e)=>{dragging=false;});
player.addEventListener('touchmove',(e)=>{
    if(!dragging) return;
    let touch=e.touches[0];
    player.style.left = (touch.pageX - player.offsetWidth/2)+"px";
    player.style.top = (touch.pageY - player.offsetHeight/2)+"px";
    e.preventDefault();
});

// PC mouse drag
document.addEventListener("mousemove",(e)=>{
    if(!dragging || !gameActive) return;
    player.style.left = e.pageX - player.offsetWidth/2 + "px";
    player.style.top = e.pageY - player.offsetHeight/2 + "px";
});

// Navigation button control
function movePlayer(dir){
    const step = 15; // pixels per click
    let left = player.offsetLeft;
    let top = player.offsetTop;
    if(dir==='left') left -= step;
    if(dir==='right') left += step;
    if(dir==='up') top -= step;
    if(dir==='down') top += step;
    // Keep player inside window
    left=Math.max(0, Math.min(window.innerWidth - player.offsetWidth, left));
    top=Math.max(0, Math.min(window.innerHeight - player.offsetHeight, top));
    player.style.left = left+"px";
    player.style.top = top+"px";
}

function startGame(){
    document.getElementById("startScreen").style.display="none";
    gameActive=true;
    setPlayerStart();
    bgMusic.play();
    spawnEnemy();
    spawnHealth();
    spawnMinus();
}

function getSpeedMultiplier(){
    if(score>=30) return 2.5;
    if(score>=20) return 2;
    if(score>=10) return 1.5;
    return 1;
}

// ---------- SPAWN FUNCTIONS ---------------
// Reduced bomb count by increasing spawn delay
function spawnEnemy(){
    if(!gameActive) return;
    let enemy=document.createElement("img");
    enemy.src="fahim2.png";
    enemy.className="enemy";
    enemy.style.left=Math.random()*(window.innerWidth - 100)+"px";
    let duration = baseFallDuration/getSpeedMultiplier();
    enemy.style.animationDuration = duration+"s";
    document.body.appendChild(enemy);

    let check=setInterval(()=>{
        if(checkCollision(player,enemy)){
            enemy.remove();
            clearInterval(check);
            loseLife();
        }
    },10);

    setTimeout(()=>{
        enemy.remove();
        clearInterval(check);
        if(gameActive){
            score++;
            document.getElementById("score").innerText=score;
        }
    },duration*1000);

    setTimeout(spawnEnemy, 2000); // Fewer bombs
}

function spawnHealth(){
    if(!gameActive) return;
    let item=document.createElement("img");
    item.src="health.png";
    item.className="health";
    item.style.left=Math.random()*(window.innerWidth-60)+"px";
    let duration = 5;
    item.style.animationDuration = duration+"s";
    document.body.appendChild(item);

    let check=setInterval(()=>{
        if(checkCollision(player,item)){
            item.remove();
            clearInterval(check);
            gainLife();
        }
    },10);

    setTimeout(()=>{
        item.remove();
        clearInterval(check);
    }, duration*1000);

    setTimeout(spawnHealth, 8000);
}

function spawnMinus(){
    if(!gameActive) return;
    let item=document.createElement("img");
    item.src="minus.png";
    item.className="minus";
    item.style.left=Math.random()*(window.innerWidth-60)+"px";
    let duration = 5;
    item.style.animationDuration = duration+"s";
    document.body.appendChild(item);

    let check=setInterval(()=>{
        if(checkCollision(player,item)){
            item.remove();
            clearInterval(check);
            minusHit();
        }
    },10);

    setTimeout(()=>{
        item.remove();
        clearInterval(check);
    }, duration*1000);

    setTimeout(spawnMinus, 12000);
}

// -------- LIFE & COLLISION ----------
function gainLife(){
    if(lives<maxLives){
        lives++;
        document.getElementById("lives").innerText=lives;
        healthSound.currentTime=0; healthSound.play();
    }
}

function loseLife(){
    lives--;
    document.getElementById("lives").innerText=lives;
    explodeSound.play();
    if(navigator.vibrate){navigator.vibrate(200);}
    if(lives<=0) endGame();
}

function minusHit(){
    minusSound.play();
    if(navigator.vibrate){navigator.vibrate(300);}
    endGame();
}

function checkCollision(a,b){
    let r1=a.getBoundingClientRect();
    let r2=b.getBoundingClientRect();
    return !(r1.top>r2.bottom||r1.bottom<r2.top||r1.right<r2.left||r1.left>r2.right);
}

// END GAME
function endGame(){
    gameActive=false;
    bgMusic.pause();
    if(score>highScore){ localStorage.setItem("highScore",score); }
    document.getElementById("finalScore").innerText = score;
    document.getElementById("overlay").style.display = "flex";
}
</script>

</body>
</html>
